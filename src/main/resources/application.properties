spring.application.name=spring-boot-complete

# The default H2 database keeps local development and tests self-contained.
# Kubernetes activates application-kubernetes.properties and connects to MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:springboot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
