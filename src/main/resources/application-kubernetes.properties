# mysql-service is the Kubernetes Service name. Override these values when the
# Service, database, or username differs in a target namespace.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service:3306/spring_boot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
